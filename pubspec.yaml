name: coach_app
description: "Coach-App für Training und Ernährung auf Basis der eigenen Garmin-Daten."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  coach_engine:
    path: packages/coach_engine

  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
